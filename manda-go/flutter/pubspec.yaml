name: manda_go
description: Manda Go - Learn Mandarin Chinese with AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  go_router: ^12.0.0
  dio: ^5.3.2
  retrofit: ^4.0.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  lottie: ^2.7.0
  flutter_animate: ^4.2.0
  just_audio: ^0.9.36
  record: ^5.0.4
  permission_handler: ^11.0.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  get_it: ^7.6.4
  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.4
  firebase_messaging: ^14.7.6
  fl_chart: ^0.64.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  video_player: ^2.8.1
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  in_app_review: ^2.0.8
  equatable: ^2.0.5
  intl: ^0.18.1
  flutter_local_notifications: ^16.1.0
  uuid: ^4.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
